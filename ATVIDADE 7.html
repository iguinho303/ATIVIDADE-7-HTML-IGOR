<html>
<head>
    <meta charset="UTF-8">
    <title>Formulário Simples</title>
</head>

<body>

    <h2>Formulário de Cadastro</h2>

    <form action="#" method="POST">

        <!-- Campo para Nome -->
        <p>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome"
            name="nome" placeholder="Digite seu nome" required>
        </p>

        <!-- Campo para E-mail -->
        <p>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email"
            name="email" placeholder="Digite seu e-mail" required>
        </p>

        <!-- Campo para Senha -->
        <p>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha"
            name="senha" placeholder="Digite sua senha" required>
        </p>

        <!-- Campo para Data de Nascimento -->
        <p>
            <label for="data">Data de Nascimento:</label><br>
            <input type="date" id="data"
            name="data" required>
        </p>

        <!-- Campo para Telefone -->
        <p>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone"
            name="telefone" placeholder="Digite seu telefone">
        </p>

        <!-- Botão de Enviar -->
        <p>
            <input type="submit" value="Cadastrar">
        </p>

    </form>

</body>
</html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulário Simples</title>
</head>
<body>

    <h2>Formulário de Cadastro</h2>

    <form action="#" method="POST">

        <!-- Campo para Nome -->
        <p>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome"
            name="nome" placeholder="Digite seu nome" required>
        </p>

        <!-- Campo para E-mail -->
        <p>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            required>
        </p>

        <!-- Campo para Senha -->
        <p>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha"
            name="senha" required>
        </p>

        <!-- Campo de Seleção (Dropdown) -->
        <p>
            <label for="assunto">Assunto:</label><br>
            <select id="assunto"
            name="assunto">
                <option value="duvida">Dúvida</option>
                <option value="sugestao">Sugestão</option>
                <option value="suporte">Suporte</option>
            </select>
        </p>

        <!-- Caixa de Texto Grande -->
        <p>
            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem"
            name="mensagem"
            rows="5"
            cols="40"
            placeholder="Digite sua mensagem"></textarea>
        </p>

        <!-- Botão de Enviar -->
        <p>
            <input type="submit" value="Enviar">
        </p>

    </form>

</body>
</html>
